name: Build and Deploy to Azure Web App

on:
  push:
    branches: 
      - main
      - staging
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AZURE_WEBAPP_NAME: your-app-name  # Set this to your Azure Web App name
  NODE_VERSION: '20'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set environment variables for staging
        if: github.ref == 'refs/heads/staging' || github.event.inputs.environment == 'staging'
        run: |
          echo "VITE_APP_ENV=staging" >> $GITHUB_ENV
          echo "VITE_API_URL=${{ vars.STAGING_API_URL }}" >> $GITHUB_ENV
          echo "VITE_APP_TITLE=${{ vars.STAGING_APP_TITLE }}" >> $GITHUB_ENV

      - name: Set environment variables for production
        if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
        run: |
          echo "VITE_APP_ENV=production" >> $GITHUB_ENV
          echo "VITE_API_URL=${{ vars.PRODUCTION_API_URL }}" >> $GITHUB_ENV
          echo "VITE_APP_TITLE=${{ vars.PRODUCTION_APP_TITLE }}" >> $GITHUB_ENV

      - name: Build application
        run: npm run build
        env:
          VITE_APP_ENV: ${{ env.VITE_APP_ENV }}
          VITE_API_URL: ${{ env.VITE_API_URL }}
          VITE_APP_TITLE: ${{ env.VITE_APP_TITLE }}

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://${{ env.AZURE_WEBAPP_NAME }}-staging.azurewebsites.net

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Staging Slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: staging
          package: dist

      - name: Azure Logout
        run: az logout

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: dist

      - name: Azure Logout
        run: az logout

  swap-staging-to-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    environment:
      name: production-approval

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Swap Staging to Production
        run: |
          az webapp deployment slot swap \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --slot staging \
            --target-slot production

      - name: Azure Logout
        run: az logout
